[project]
name = "roxtrack"
version = "0.1.0"
description = "HYROX race animation prototype"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["matplotlib>=3.9.0"]

[project.scripts]
hyroxanim = "hyroxanim.cli:main"

[dependency-groups]
dev = ["ruff>=0.11.0", "pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/hyroxanim"]
