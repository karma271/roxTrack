<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>roxTrack Viewer</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        background: #111;
        color: #eee;
      }
      .layout {
        max-width: 1200px;
        margin: 0 auto;
        padding: 16px;
      }
      h1 {
        margin: 0 0 12px;
      }
      .meta {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 12px;
        font-size: 14px;
      }
      .below-panels {
        margin-top: 12px;
        display: grid;
        gap: 12px;
      }
      .panel {
        border: 1px solid #2a2a2a;
        background: #171717;
        padding: 12px;
      }
      .panel h2 {
        margin: 0 0 8px;
        font-size: 16px;
      }
      #athlete-select {
        width: 100%;
        min-height: 120px;
        background: #0f0f0f;
        color: #f0f0f0;
        border: 1px solid #343434;
      }
      .rank-table-wrap {
        max-height: 320px;
        overflow: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th,
      td {
        border-bottom: 1px solid #2f2f2f;
        padding: 6px;
        text-align: left;
      }
      th {
        position: sticky;
        top: 0;
        background: #1e1e1e;
      }
      .athlete-cell {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .chip {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        display: inline-block;
      }
      .progress-cell {
        min-width: 120px;
      }
      .progress-track {
        position: relative;
        height: 16px;
        border-radius: 999px;
        overflow: hidden;
        background: #2d2d2d;
      }
      .progress-fill {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
      }
      .progress-text {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        color: #fff;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
      }
      .canvas-wrap {
        border: 1px solid #2a2a2a;
        background: #171717;
      }
      canvas {
        width: 100%;
        height: auto;
        display: block;
      }
      .controls {
        margin: 10px 0 8px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .controls label {
        font-size: 13px;
        color: #d8d8d8;
      }
      .controls input[type="range"] {
        width: min(520px, 90vw);
      }
      .hint {
        margin-top: 8px;
        color: #a9a9a9;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <h1>
        <span style="color: #ffd93d">rox</span><span style="color: #ffffff">Track</span>
        Viewer
      </h1>
      <div class="meta">
        <div id="status">Loading viewer data...</div>
        <div id="time">t=0.00s</div>
      </div>
      <div class="canvas-wrap">
        <canvas id="viewer-canvas" width="1200" height="720"></canvas>
      </div>
      <div class="controls">
        <button id="play-pause-btn" type="button">Pause</button>
        <label>
          Seek
          <input id="seek-slider" type="range" min="0" max="1000" value="0" step="1" />
        </label>
        <label>
          Speed
          <select id="speed-select">
            <option value="0.5">0.5x</option>
            <option value="1">1x</option>
            <option value="2">2x</option>
            <option value="4">4x</option>
            <option value="8" selected>8x</option>
            <option value="12">12x</option>
          </select>
        </label>
      </div>
      <div class="below-panels">
        <section class="panel">
          <h2>Athlete Selection (multi-select)</h2>
          <select id="athlete-select" multiple></select>
        </section>
        <section class="panel">
          <h2>Live Ranking</h2>
          <div class="rank-table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Rank</th>
                  <th>Athlete</th>
                  <th>Status</th>
                  <th>Time In</th>
                  <th>Progress</th>
                </tr>
              </thead>
              <tbody id="rank-table-body"></tbody>
            </table>
          </div>
        </section>
      </div>
      <div class="hint">
        Tip: serve repo root with <code>python -m http.server</code> and open
        <code>/viewer/index.html</code>.
      </div>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
